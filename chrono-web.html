<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHRONO.LOOP WEB · 时间回溯平台跳跃</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#0B1520; --surface:#101E2C; --surface2:#16293B;
    --border:#1F3A52; --text:#E6EEF6; --muted:#8FA6BC;
    --teal:#3ECFB8; --teal-dim:#2A9C8B; --orange:#FF9E5E; --orange-dim:#D97A38;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:Consolas,'Noto Sans SC','Microsoft YaHei',monospace;
    overflow:hidden;user-select:none;-webkit-user-select:none;}
  /* 点阵背景 */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(140,180,215,.06) 1px,transparent 1px);
    background-size:28px 28px;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;}
  #stage{position:relative;}
  canvas{display:block;background:var(--bg);
    border:1px solid var(--border);border-radius:10px;
    box-shadow:0 30px 90px rgba(0,0,0,.55);
    max-width:100%;height:auto;}
  /* HUD */
  #hud{position:absolute;top:14px;left:18px;right:18px;display:flex;
    justify-content:space-between;align-items:flex-start;pointer-events:none;
    font-size:13px;letter-spacing:.08em;z-index:5;}
  .hud-stat{background:rgba(11,21,32,.72);border:1px solid var(--border);
    border-radius:8px;padding:8px 14px;min-width:96px;backdrop-filter:blur(4px);}
  .hud-stat .k{color:var(--muted);font-size:10px;letter-spacing:.22em;}
  .hud-stat .v{color:var(--teal);font-size:17px;font-weight:700;margin-top:2px;}
  .hud-stat .v.warn{color:var(--orange);}
  #hud-right{text-align:right;}
  #hud-right .k{color:var(--muted);font-size:10.5px;line-height:1.9;letter-spacing:.06em;}
  #hud-right .k b{color:var(--teal);font-weight:700;}
  #rewindBar{position:absolute;left:18px;right:18px;bottom:16px;height:4px;
    background:rgba(31,58,82,.5);border-radius:2px;z-index:5;overflow:hidden;}
  #rewindFill{height:100%;width:100%;background:linear-gradient(90deg,var(--teal),var(--orange));
    transition:width .1s linear;}
  /* 覆盖层 */
  #overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:rgba(5,11,17,.82);border-radius:10px;backdrop-filter:blur(4px);
    text-align:center;padding:24px;transition:opacity .25s;}
  #overlay.hide{opacity:0;pointer-events:none;}
  #overlay .box{max-width:560px;}
  #overlay h1{font-size:clamp(26px,4.5vw,40px);letter-spacing:.1em;color:var(--teal);
    font-weight:700;margin-bottom:8px;text-shadow:0 0 24px rgba(62,207,184,.35);}
  #overlay h1 .cur{display:inline-block;width:.6em;height:1em;background:var(--orange);
    vertical-align:-.1em;margin-left:6px;animation:blink 1.1s steps(2) infinite;}
  @keyframes blink{50%{opacity:0;}}
  #overlay .sub{color:var(--muted);font-size:13.5px;letter-spacing:.14em;margin-bottom:26px;}
  #overlay .keys{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px;}
  .key{background:var(--surface2);border:1px solid var(--border);border-radius:6px;
    padding:7px 13px;font-size:12px;color:var(--text);letter-spacing:.04em;}
  .key b{color:var(--teal);}
  #overlay .start-hint{color:var(--orange);font-size:13px;letter-spacing:.2em;animation:blink 1.4s steps(2) infinite;}
  #overlay .result{margin-bottom:20px;}
  #overlay .result .big{font-size:30px;color:var(--teal);font-weight:700;letter-spacing:.06em;margin-bottom:12px;}
  #overlay .result .stats{color:var(--muted);font-size:14px;line-height:2;}
  #overlay .result .stats b{color:var(--text);}
  #overlay .back{margin-top:22px;font-size:12px;color:var(--muted);letter-spacing:.08em;}
  #overlay .back a{color:var(--teal);text-decoration:none;border-bottom:1px dashed var(--teal-dim);}
  #toast{position:absolute;top:76px;left:50%;transform:translateX(-50%);z-index:9;
    background:var(--surface2);border:1px solid var(--teal-dim);color:var(--text);
    font-size:13px;padding:9px 18px;border-radius:8px;opacity:0;transition:opacity .25s;
    letter-spacing:.06em;pointer-events:none;}
  #toast.show{opacity:1;}
  /* ---- 移动端触控 ---- */
  #touch-controls{
    position:absolute;left:14px;right:14px;bottom:26px;z-index:6;
    display:none;justify-content:space-between;align-items:flex-end;
    pointer-events:none;
  }
  #touch-controls.show{display:flex;}
  .tc-group{display:flex;gap:12px;pointer-events:auto;}
  .tc-btn{
    width:74px;height:74px;border-radius:16px;border:1.5px solid var(--teal-dim);
    background:rgba(22,41,59,.72);color:var(--teal);font-size:30px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);touch-action:none;
    transition:background .15s,transform .1s;
  }
  .tc-btn:active,.tc-btn.held{background:rgba(62,207,184,.28);transform:scale(.93);}
  .tc-btn.small{width:64px;height:64px;font-size:22px;}
  .tc-btn.rewind{color:var(--orange);border-color:rgba(255,158,94,.5);}
  @media (max-width:1000px){ #wrap{padding:0 12px;} }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hud">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <div class="hud-stat"><div class="k">TIME</div><div class="v" id="hTime">00.0s</div></div>
        <div class="hud-stat"><div class="k">DEATHS</div><div class="v warn" id="hDeath">0</div></div>
        <div class="hud-stat"><div class="k">REWINDS</div><div class="v" id="hRewind">0</div></div>
      </div>
      <div id="hud-right">
        <div class="k"><b>A/D</b> 移动 &nbsp; <b>SPACE</b> 跳跃 &nbsp; <b>R</b> 回溯 &nbsp; <b>P</b> 暂停</div>
      </div>
    </div>
    <div id="rewindBar"><div id="rewindFill"></div></div>
    <div id="touch-controls">
      <div class="tc-group">
        <button class="tc-btn" data-tc="left" aria-label="左移">◀</button>
        <button class="tc-btn" data-tc="right" aria-label="右移">▶</button>
      </div>
      <div class="tc-group">
        <button class="tc-btn small rewind" data-tc="rewind" aria-label="回溯">⟲</button>
        <button class="tc-btn" data-tc="jump" aria-label="跳跃">⤒</button>
      </div>
    </div>
    <div id="toast"></div>
    <div id="overlay">
      <div class="box">
        <h1>CHRONO.LOOP<span class="cur"></span></h1>
        <div class="sub">WEB PROTOTYPE · 时间回溯平台跳跃</div>
        <div class="keys">
          <span class="key"><b>A / D</b> 移动</span>
          <span class="key"><b>空格</b> 跳跃</span>
          <span class="key"><b>R</b> 回溯 3 秒</span>
          <span class="key"><b>P</b> 暂停</span>
        </div>
        <p class="start-hint" id="startHint">按 空格 / 回车 开始</p>
        <p class="back" id="backLink"><a href="index.html">← 返回作品集</a></p>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CHRONO.LOOP WEB — 时间回溯平台跳跃原型
   机制：死亡或手动按 R 时，沿记录回溯角色状态（残影 + 光点回流）
   ============================================================ */
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 540;
canvas.width = W; canvas.height = H;

const TEAL = '#3ECFB8', TEAL_DIM = '#2A9C8B';
const ORANGE = '#FF9E5E', ORANGE_DIM = '#D97A38';
const BG = '#0B1520', SURFACE = '#101E2C', BORDER = '#1F3A52';
const TEXT = '#E6EEF6', MUTED = '#8FA6BC';

const GRAVITY = 2200, MOVE_SPEED = 280, JUMP_V = -760;
const MAX_REWIND = 5.0;          // 秒
const AUTO_REWIND = 2.5;         // 死亡自动回溯时长（2 倍速回放 5 秒历史）
const MANUAL_REWIND = 3.0;       // 手动 R 回溯时长（1 倍速回放 3 秒历史）
const HISTORY_FPS = 60;          // 记录频率（与 rAF 解耦）
const HISTORY_MAX = Math.ceil(MAX_REWIND * HISTORY_FPS);

/* ---------- 关卡 ---------- */
const GROUND_Y = 500;
const platforms = [
  { x: 0,     y: GROUND_Y, w: 960, h: 40 },
  { x: 200,   y: 420,      w: 120, h: 18 },
  { x: 380,   y: 340,      w: 130, h: 18 },
  { x: 580,   y: 420,      w: 120, h: 18 },
  { x: 66,    y: 250,      w: 110, h: 18 },   // 高处奖励平台
  { x: 760,   y: 200,      w: 120, h: 18 },
];
const spikes = [
  { x: 430, y: GROUND_Y }, { x: 470, y: GROUND_Y }, { x: 510, y: GROUND_Y },
  { x: 640, y: 420 }, { x: 690, y: 420 },
];
const movingPlats = [
  { x: 660, y: 300, w: 90, h: 16, a: 660, b: 880, speed: 120, dir: 1 },
];
const exit = { x: 810, y: 152, w: 44, h: 44 };

const playerW = 28, playerH = 32;
const spawn = { x: 60, y: 452 };

/* ---------- 游戏状态 ---------- */
let state = 'ready';        // ready | play | dead | rewind | win | pause
let player, timer, deaths, rewindCount, tAcc, histAcc, history, lastSafe;
let particles = [], ghosts = [];
let rewindTimer = 0, rewindDuration = 0, rewindReason = '';
let winTime = 0, winDeaths = 0, winRewinds = 0;
let timeScale = 1, shake = 0;
const keys = {};

/* ---------- 输入 ---------- */
addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft','ArrowRight','ArrowUp',' ','Spacebar','Enter'].includes(k)) e.preventDefault();
  keys[k] = true;
  keys[k.toLowerCase()] = true;
  if (state === 'ready' && (k === ' ' || k === 'Spacebar' || k === 'Enter')) startGame();
  else if (state === 'win' && (k === ' ' || k === 'Spacebar' || k === 'Enter')) startGame();
  else if (state === 'play' && (k === 'r' || k === 'R' || k === 'Backspace')) {
    if (history.length >= 10) startRewind(MANUAL_REWIND, 'manual');
  }
  else if (k === 'p' || k === 'P') {
    if (state === 'play') { state = 'pause'; showToast('已暂停 · P 继续'); }
    else if (state === 'pause') { state = 'play'; hideToast(); }
  }
});
addEventListener('keyup', e => { keys[e.key] = false; keys[e.key.toLowerCase()] = false; });

/* ---------- 移动端触控 ---------- */
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const tc = document.getElementById('touch-controls');
if (isTouch){
  tc.classList.add('show');
  const hint = document.querySelector('#hud-right .k');
  if (hint) hint.innerHTML = '<b>◀ ▶</b> 移动 &nbsp; <b>⤒</b> 跳跃 &nbsp; <b>⟲</b> 回溯';
  const keyMap = { left: 'ArrowLeft', right: 'ArrowRight', jump: ' ' };
  document.querySelectorAll('.tc-btn').forEach(btn => {
    const act = btn.dataset.tc;
    const press = e => {
      e.preventDefault();
      if (act === 'rewind'){
        if (state === 'play' && history.length >= 10) startRewind(MANUAL_REWIND, 'manual');
      } else {
        keys[keyMap[act]] = true;
        btn.classList.add('held');
      }
    };
    const release = () => {
      if (act !== 'rewind') keys[keyMap[act]] = false;
      btn.classList.remove('held');
    };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });
  // 触屏设备：点按画面开始/重开
  const overlayEl = document.getElementById('overlay');
  overlayEl.addEventListener('click', () => {
    if (state === 'ready' || state === 'win') startGame();
  });
}

/* ---------- 工具 ---------- */
function rectsOverlap(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function rectPoint(r, px, py){
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }

/* ---------- 粒子 ---------- */
function burst(x, y, color, n, spread, speed){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.3 + Math.random() * 0.7);
    particles.push({
      x, y, vx: Math.cos(a) * s * (spread || 1), vy: Math.sin(a) * s * (spread || 1) - 60,
      life: 0.5 + Math.random() * 0.4, t: 0, color, size: 2 + Math.random() * 3
    });
  }
}
function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.t += dt; p.vy += 900 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t >= p.life) particles.splice(i, 1);
  }
}

/* ---------- 历史记录 ---------- */
function record(){
  history.push({ x: player.x, y: player.y, vx: player.vx, vy: player.vy });
  if (history.length > HISTORY_MAX) history.shift();
}
function snapshot(){ return { x: player.x, y: player.y, vx: player.vx, vy: player.vy }; }
function restore(s){
  player.x = s.x; player.y = s.y; player.vx = s.vx; player.vy = s.vy;
}

/* ---------- 游戏流程 ---------- */
function startGame(){
  Object.keys(keys).forEach(k => keys[k] = false);
  player = { x: spawn.x, y: spawn.y, vx: 0, vy: 0, onGround: false, facing: 1 };
  history = []; ghosts = []; particles = [];
  timer = 0; deaths = 0; rewindCount = 0;
  tAcc = 0; histAcc = 0; shake = 0;
  timeScale = 1; state = 'play';
  hideToast();
  hideOverlay();
  for (let i = 0; i < 40; i++) record();   // 预热历史，避免开局即死无法回溯
  lastSafe = snapshot();
}

function startRewind(duration, reason){
  rewindReason = reason;
  rewindDuration = duration;
  rewindTimer = duration;
  state = 'rewind';
  rewindCount++;
  burst(player.x + playerW / 2, player.y + playerH / 2, TEAL, 16, 1, 160);
  updateHUD();
}

function die(){
  deaths++;
  shake = 0.5;
  burst(player.x + playerW / 2, player.y + playerH / 2, ORANGE, 34, 1, 320);
  startRewind(AUTO_REWIND, 'death');
  updateHUD();
}

function win(){
  state = 'win';
  winTime = timer; winDeaths = deaths; winRewinds = rewindCount;
  for (let i = 0; i < 60; i++){
    const a = Math.random() * Math.PI * 2;
    particles.push({
      x: exit.x + exit.w / 2 + Math.cos(a) * 40, y: exit.y + exit.h / 2 + Math.sin(a) * 40,
      vx: Math.cos(a) * 220, vy: Math.sin(a) * 220 - 120,
      life: 1.2 + Math.random() * 0.8, t: 0,
      color: Math.random() < 0.5 ? TEAL : ORANGE, size: 2 + Math.random() * 3
    });
  }
  showOverlay('win');
}

/* ---------- 物理 ---------- */
function updatePlayer(dt){
  const dir = (keys['ArrowRight'] || keys['d'] || keys['D'] ? 1 : 0) -
              (keys['ArrowLeft']  || keys['a'] || keys['A'] ? 1 : 0);
  player.vx = dir * MOVE_SPEED;
  if (dir) player.facing = dir;
  player.vy += GRAVITY * dt;
  if (player.vy > 1400) player.vy = 1400;

  let prevBottom = player.y + playerH;
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  // 平台碰撞（单向：仅从上方落下）
  player.onGround = false;
  const pRect = { x: player.x, y: player.y, w: playerW, h: playerH };
  for (const pl of platforms){
    if (pl.y === GROUND_Y) continue;      // 地面单独处理
    const overlap = pRect.x < pl.x + pl.w && pRect.x + playerW > pl.x;
    if (overlap && player.vy >= 0 && prevBottom <= pl.y + 6){
      player.y = pl.y - playerH;
      player.vy = 0;
      player.onGround = true;
    }
  }
  // 地面
  if (player.y + playerH > GROUND_Y){
    player.y = GROUND_Y - playerH;
    player.vy = 0;
    player.onGround = true;
  }
  if (player.x < 0) player.x = 0;
  if (player.x > W - playerW) player.x = W - playerW;

  // 跳跃
  if ((keys[' '] || keys['Spacebar'] || keys['ArrowUp'] || keys['w'] || keys['W']) && player.onGround){
    player.vy = JUMP_V;
    player.onGround = false;
    burst(player.x + playerW / 2, player.y + playerH, TEAL, 6, 0.6, 120);
  }

  // 移动平台
  for (const mp of movingPlats){
    mp.x += mp.dir * mp.speed * dt;
    if (mp.x >= mp.b) mp.dir = -1;
    if (mp.x <= mp.a) mp.dir = 1;
    const onTop = pRect.x < mp.x + mp.w && pRect.x + playerW > mp.x &&
                  Math.abs((player.y + playerH) - mp.y) < 10 && player.vy >= 0;
    if (onTop){
      player.y = mp.y - playerH;
      player.vy = 0;
      player.onGround = true;
    }
  }

  // 尖刺碰撞
  const hitbox = { x: player.x + 4, y: player.y + 4, w: playerW - 8, h: playerH - 4 };
  let onSpike = false;
  for (const s of spikes){
    const sRect = { x: s.x - 7, y: s.y - 16, w: 14, h: 16 };
    if (rectsOverlap(hitbox, sRect)) onSpike = true;
  }
  // 记录最近安全立足点（回溯耗尽的兜底）
  if (player.onGround && !onSpike) lastSafe = snapshot();
  if (onSpike) { die(); return; }

  // 终点
  if (rectsOverlap(hitbox, exit)) win();
}

/* ---------- 回溯 ---------- */
function updateRewind(dt){
  // 倒带：每帧消费历史（death 2 倍速 / manual 1 倍速，与时长相匹配）
  const framesToConsume = rewindReason === 'death' ? 2 : 1;
  for (let i = 0; i < framesToConsume; i++){
    if (history.length > 0){
      const s = history.pop();
      // 残影
      ghosts.push({ x: s.x, y: s.y, t: 0, life: 0.4 });
      restore(s);
    }
  }
  rewindTimer -= dt;
  // 回流光点
  if (Math.random() < 0.5){
    const cx = player.x + playerW / 2, cy = player.y + playerH / 2;
    const a = Math.random() * Math.PI * 2, r = 90 + Math.random() * 80;
    particles.push({
      x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r,
      vx: -Math.cos(a) * 420, vy: -Math.sin(a) * 420,
      life: 0.35, t: 0, color: TEAL, size: 1.5 + Math.random() * 2
    });
  }
  if (rewindTimer <= 0){
    if (history.length > 0){
      lastSafe = { ...history[history.length - 1] };
      restore(lastSafe);
    } else if (lastSafe){
      restore(lastSafe);
    } else {
      player.x = spawn.x; player.y = spawn.y; player.vx = 0; player.vy = 0;
    }
    if (rewindReason === 'manual') showToast('已回溯 ' + MANUAL_REWIND + ' 秒');
    state = 'play';
  }
}

/* ---------- 渲染 ---------- */
function drawGrid(){
  ctx.strokeStyle = 'rgba(62,207,184,.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 48){
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += 48){
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

function drawPlatforms(){
  for (const pl of platforms){
    const isGround = pl.y === GROUND_Y;
    ctx.fillStyle = isGround ? SURFACE : '#132434';
    ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
    // 顶部发光边
    ctx.fillStyle = isGround ? 'rgba(62,207,184,.35)' : TEAL;
    ctx.fillRect(pl.x, pl.y, pl.w, 2.5);
    ctx.strokeStyle = BORDER; ctx.strokeRect(pl.x + .5, pl.y + .5, pl.w - 1, pl.h - 1);
  }
  // 移动平台
  for (const mp of movingPlats){
    ctx.fillStyle = '#15303F';
    ctx.fillRect(mp.x, mp.y, mp.w, mp.h);
    ctx.fillStyle = ORANGE;
    ctx.fillRect(mp.x, mp.y, mp.w, 3);
    ctx.fillStyle = ORANGE;
    ctx.fillRect(mp.x + mp.w / 2 - 4, mp.y - 6, 8, 6);
    ctx.fillStyle = 'rgba(255,158,94,.16)';
    ctx.fillRect(mp.a, mp.y - 1, mp.b - mp.a, mp.h + 2);
  }
}

function drawSpikes(){
  ctx.fillStyle = ORANGE;
  for (const s of spikes){
    ctx.beginPath();
    ctx.moveTo(s.x - 7, s.y);
    ctx.lineTo(s.x, s.y - 16);
    ctx.lineTo(s.x + 7, s.y);
    ctx.closePath(); ctx.fill();
  }
}

function drawExit(){
  const g = ctx.createRadialGradient(exit.x + exit.w / 2, exit.y + exit.h / 2, 4,
                                     exit.x + exit.w / 2, exit.y + exit.h / 2, 40);
  g.addColorStop(0, 'rgba(62,207,184,.35)');
  g.addColorStop(1, 'rgba(62,207,184,0)');
  ctx.fillStyle = g;
  ctx.fillRect(exit.x - 24, exit.y - 24, exit.w + 48, exit.h + 48);
  ctx.fillStyle = TEAL;
  ctx.fillRect(exit.x, exit.y, exit.w, exit.h);
  ctx.strokeStyle = TEXT; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(exit.x + 12, exit.y + 12); ctx.lineTo(exit.x + 30, exit.y + exit.h / 2); ctx.lineTo(exit.x + 12, exit.y + exit.h - 12);
  ctx.stroke();
  ctx.fillStyle = 'rgba(230,238,246,.8)';
  ctx.font = 'bold 12px Consolas,monospace';
  ctx.textAlign = 'center';
  ctx.fillText('EXIT', exit.x + exit.w / 2, exit.y - 12);
}

function drawPlayer(){
  const x = player.x, y = player.y;
  // 残影
  for (const gh of ghosts){
    ctx.globalAlpha = Math.max(0, 1 - gh.t / gh.life) * .35;
    ctx.fillStyle = TEAL;
    ctx.fillRect(gh.x, gh.y, playerW, playerH);
    ctx.globalAlpha = 1;
  }
  // 本体
  ctx.fillStyle = SURFACE;
  ctx.fillRect(x, y, playerW, playerH);
  ctx.strokeStyle = TEAL; ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, playerW - 2, playerH - 2);
  // 眼
  const ex = player.facing > 0 ? x + 19 : x + 6;
  ctx.fillStyle = TEXT;
  ctx.fillRect(ex, y + 10, 4, 5);
  // 光环（回溯中）
  if (state === 'rewind'){
    const t = performance.now() / 300;
    ctx.strokeStyle = 'rgba(62,207,184,.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x + playerW / 2, y + playerH / 2, 24 + Math.sin(t * 6) * 5, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawGhosts(){
  // 残影由 drawPlayer 内绘制；这里更新寿命
}

function updateGhosts(dt){
  for (let i = ghosts.length - 1; i >= 0; i--){
    ghosts[i].t += dt;
    if (ghosts[i].t >= ghosts[i].life) ghosts.splice(i, 1);
  }
}

function drawParticles(){
  for (const p of particles){
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    ctx.globalAlpha = 1;
  }
}

/* ---------- HUD / 覆盖层 ---------- */
const elTime = document.getElementById('hTime');
const elDeath = document.getElementById('hDeath');
const elRewind = document.getElementById('hRewind');
const elFill = document.getElementById('rewindFill');
const elOverlay = document.getElementById('overlay');
const elToast = document.getElementById('toast');
let toastTimer = 0;

function updateHUD(){
  elTime.textContent = timer.toFixed(1) + 's';
  elDeath.textContent = deaths;
  elRewind.textContent = rewindCount;
  const ratio = history.length / HISTORY_MAX;
  elFill.style.width = (ratio * 100).toFixed(1) + '%';
}
function showToast(msg){
  elToast.textContent = msg;
  elToast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => elToast.classList.remove('show'), 1600);
}
function hideToast(){ elToast.classList.remove('show'); }
function hideOverlay(){ elOverlay.classList.add('hide'); }
function showOverlay(kind){
  elOverlay.classList.remove('hide');
  const box = elOverlay.querySelector('.box');
  if (kind === 'win'){
    box.innerHTML =
      '<h1>LEVEL CLEAR<span class="cur"></span></h1>' +
      '<div class="sub">时间回溯原型 · 通关</div>' +
      '<div class="result">' +
        '<div class="big">' + winTime.toFixed(1) + 's</div>' +
        '<div class="stats">死亡 <b>' + winDeaths + '</b> 次 &nbsp;·&nbsp; 回溯 <b>' + winRewinds + '</b> 次</div>' +
      '</div>' +
      '<p class="start-hint">按 空格 / 回车 再玩一次</p>' +
      '<p class="back"><a href="index.html">← 返回作品集</a></p>';
  }
}

/* ---------- 主循环 ---------- */
let last = performance.now();
function loop(now){
  let dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (state === 'play' || state === 'rewind'){
    timer += dt;
    // 历史记录（独立频率）
    tAcc += dt;
    while (tAcc >= 1 / HISTORY_FPS){
      tAcc -= 1 / HISTORY_FPS;
      if (state === 'play') record();
    }
    if (state === 'play'){
      updatePlayer(dt);
      if (state === 'play') updateHUD();
    } else if (state === 'rewind'){
      updateRewind(dt);
      if (state === 'play') updateHUD();
    }
  }

  updateParticles(dt);
  updateGhosts(dt);

  if (shake > 0) shake = Math.max(0, shake - dt);

  // 渲染
  ctx.save();
  if (shake > 0){
    ctx.translate((Math.random() - .5) * shake * 16, (Math.random() - .5) * shake * 16);
  }
  // 背景
  ctx.fillStyle = BG;
  ctx.fillRect(-8, -8, W + 16, H + 16);
  drawGrid();
  drawExit();
  drawPlatforms();
  drawSpikes();
  drawParticles();
  if (state !== 'ready') drawPlayer();
  // 回溯时画面蓝紫氛围
  if (state === 'rewind'){
    ctx.fillStyle = 'rgba(42,92,130,.10)';
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
